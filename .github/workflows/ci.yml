name: Offline capability gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ngfi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: 0.11.28
          enable-cache: false

      - name: Install locked dependencies
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm install --frozen-lockfile
          uv sync --frozen
          uv sync --project packages/combinatorial-optimization --extra dev --frozen
          uv sync --project packages/finance-data-service/providers/tdx --frozen

      - name: Run complete offline gate
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: pnpm check
