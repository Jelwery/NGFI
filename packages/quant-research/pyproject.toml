[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngfi-quant-research"
version = "0.1.0"
description = "Deterministic research-grade quantitative validation for NGFI"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ngfi_quant", "ngfi_quant.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
