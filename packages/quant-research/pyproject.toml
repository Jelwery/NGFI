[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngfi-quant-research"
version = "0.1.0"
description = "Deterministic research-grade quantitative validation for NGFI"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.10,<3",
    "scikit-learn>=1.6,<2",
    "cvxpy>=1.6,<2",
    "clarabel>=0.10,<1",
    "threadpoolctl>=3.5,<4",
]

[project.scripts]
ngfi-quant = "ngfi_quant.research_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ngfi_quant", "ngfi_quant.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
